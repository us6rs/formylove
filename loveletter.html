<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Whole World ❤️</title>
  <style>
    /* Cohesive Color Palette */
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: rgba(18, 18, 22, 0.75);
      --baby-pink: #f4c2c2;
      --rose-gold: #e07a5f;
      --accent-glow: rgba(244, 194, 194, 0.15);
      --text-main: #f0e6e6;
      --text-muted: #a39999;
      --border-color: rgba(244, 194, 194, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: var(--baby-pink);
      color: var(--bg-dark);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(224, 122, 95, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 50% 80%, rgba(244, 194, 194, 0.05) 0%, transparent 60%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      perspective: 1000px;
      color: var(--text-main);
      padding: 40px 20px;
    }

    /* Falling Ambient Particles */
    .particle {
      position: absolute;
      background: var(--baby-pink);
      box-shadow: 0 0 8px var(--baby-pink);
      border-radius: 50%;
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes fall {
      0% { transform: translateY(-100px) scale(0); opacity: 0; }
      20% { opacity: 0.6; }
      100% { transform: translateY(100vh) scale(1); opacity: 0; }
    }

    /* Card Wrapper & 3D Tilt */
    .card-wrapper {
      width: 100%;
      max-width: 650px;
      z-index: 10;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 45px 35px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px var(--accent-glow);
      text-align: center;
    }

    .header-tag {
      display: inline-block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--rose-gold);
      margin-bottom: 8px;
      font-weight: 600;
    }

    h1 {
      color: var(--baby-pink);
      font-size: 30px;
      margin-bottom: 25px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 0 20px rgba(244, 194, 194, 0.3);
    }

    /* Letter Body Area */
    .letter-body {
      background: rgba(10, 10, 12, 0.6);
      padding: 25px;
      border-radius: 16px;
      border-left: 3px solid var(--baby-pink);
      border-top: 1px solid rgba(244, 194, 194, 0.05);
      font-size: 16px;
      line-height: 1.8;
      text-align: left;
      margin-bottom: 35px;
      min-height: 170px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    #typewriter-text {
      color: var(--text-main);
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 18px;
      background-color: var(--baby-pink);
      animation: blink 0.7s infinite;
      vertical-align: middle;
      margin-left: 3px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Photo Gallery Section */
    .gallery-title {
      color: var(--text-muted);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 1s forwards;
      animation-delay: 4.5s;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
      margin-bottom: 35px;
      opacity: 0;
      animation: fadeIn 1s forwards;
      animation-delay: 4.5s;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .photo-card {
      background: rgba(20, 20, 25, 0.8);
      border-radius: 14px;
      padding: 8px;
      border: 1px solid var(--border-color);
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
      overflow: hidden;
    }

    .photo-card:hover {
      transform: translateY(-8px);
      border-color: var(--baby-pink);
      box-shadow: 0 10px 25px rgba(244, 194, 194, 0.2);
    }

    .photo-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      filter: brightness(0.9) contrast(1.05);
      transition: filter 0.4s ease;
    }

    .photo-card:hover img {
      filter: brightness(1) contrast(1.1);
    }

    /* Color-Coordinated Button */
    .btn {
      background: linear-gradient(135deg, var(--baby-pink) 0%, var(--rose-gold) 100%);
      color: var(--bg-dark);
      border: none;
      padding: 14px 40px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 20px rgba(224, 122, 95, 0.3);
      opacity: 0;
      animation: fadeIn 1s forwards;
      animation-delay: 5.5s;
      outline: none;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(244, 194, 194, 0.5);
      filter: brightness(1.05);
    }

    .btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <div class="card-wrapper" id="cardWrapper">
    <div class="card">
      <span class="header-tag">Private Letter</span>
      <h1>To My Safe Space 🤍</h1>

      <div class="letter-body">
        <span id="typewriter-text"></span><span class="cursor"></span>
      </div>

      <div class="gallery-title">My Favorite Memories 🌸</div>
      <div class="photo-grid">
        <div class="photo-card">
          <img src="pic1.png" alt="Memory 1">
        </div>
        <div class="photo-card">
          <img src="pic2.png" alt="Memory 2">
        </div>
        <div class="photo-card">
          <img src="pic3.png" alt="Memory 3">
        </div>
      </div>

      <button class="btn" onclick="triggerHeartExplosion()">I Love You</button>
    </div>
  </div>

  <script>
    // Message Content
    const message = "ya ru7i,\n\nYour letter completely made my day. Reading your words when I was down made me smile so hard and reminded me how lucky I am to have you in my life.\n\nYou said 'I love you' doesn't feel like enough sometimes, and I feel the exact same way. You're my comfort zone, my safe space, and my favorite part of every day.\n\nThank you for always caring about me. I definitely love you more though. ❤️";
    
    let i = 0;
    const speed = 35;
    
    function typeWriter() {
      if (i < message.length) {
        document.getElementById("typewriter-text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, speed);
      } else {
        document.querySelector('.cursor').style.display = 'none';
      }
    }

    window.onload = typeWriter;

    // 3D Hover Tilt
    const wrapper = document.getElementById('cardWrapper');
    document.addEventListener('mousemove', (e) => {
      let xAxis = (window.innerWidth / 2 - e.pageX) / 45;
      let yAxis = (window.innerHeight / 2 - e.pageY) / 45;
      wrapper.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      wrapper.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });

    // Background Particle Stream
    function createParticles() {
      for(let i = 0; i < 25; i++) {
        let particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + 'vw';
        particle.style.width = Math.random() * 4 + 2 + 'px';
        particle.style.height = particle.style.width;
        particle.style.animationDuration = Math.random() * 4 + 3 + 's';
        particle.style.animationDelay = Math.random() * 5 + 's';
        document.body.appendChild(particle);
      }
    }
    createParticles();

    // Heart Burst Effect
    function triggerHeartExplosion() {
      for (let i = 0; i < 35; i++) {
        let heart = document.createElement('div');
        heart.innerHTML = '🌸';
        heart.style.position = 'absolute';
        heart.style.left = '50%';
        heart.style.top = '80%';
        heart.style.fontSize = Math.random() * 18 + 12 + 'px';
        heart.style.pointerEvents = 'none';
        
        let angle = Math.random() * Math.PI * 2;
        let velocity = 60 + Math.random() * 120;
        let dx = Math.cos(angle) * velocity;
        let dy = Math.sin(angle) * velocity - 60;
        
        heart.animate([
          { transform: `translate(0, 0) scale(1)`, opacity: 1 },
          { transform: `translate(${dx}px, ${dy}px) scale(1.4)`, opacity: 0 }
        ], {
          duration: 1200 + Math.random() * 400,
          easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
        });
        
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1600);
      }
    }
  </script>
</body>
</html>
