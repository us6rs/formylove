<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>For My Whole World ❤️</title>
  <style>
    :root {
      --bg-dark: #070709;
      --card-bg: rgba(15, 15, 20, 0.92);
      --baby-pink: #f4c2c2;
      --rose-gold: #e07a5f;
      --hot-rose: #ff4d6d;
      --text-main: #f5eded;
      --text-muted: #a89f9f;
      --border-color: rgba(244, 194, 194, 0.22);
    }

    /* Complete Global Scrollbar Suppression */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg-dark);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 14px;
    }

    /* Start Screen Overlay (Required for instant mobile audio unlock) */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #070709;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.5s ease;
    }

    .start-heart {
      font-size: 52px;
      margin-bottom: 18px;
      animation: pulse 1.4s infinite ease-in-out;
    }

    .start-btn {
      background: linear-gradient(135deg, var(--baby-pink) 0%, var(--rose-gold) 100%);
      color: #0d0608;
      font-weight: 800;
      padding: 14px 30px;
      border-radius: 30px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 25px rgba(244, 194, 194, 0.3);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    /* Background Floating Canvas */
    #canvas-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .ambient-glow {
      position: fixed;
      width: 90vw;
      max-width: 450px;
      height: 90vw;
      max-height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(224, 122, 95, 0.14) 0%, rgba(244, 194, 194, 0.04) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
    }

    .audio-control {
      position: fixed;
      top: env(safe-area-inset-top, 16px);
      right: 16px;
      z-index: 100;
      background: rgba(20, 20, 25, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--border-color);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: var(--baby-pink);
      font-size: 18px;
    }

    .card-wrapper {
      width: 100%;
      max-width: 480px;
      z-index: 10;
      margin: auto;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 24px 18px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 35px rgba(244, 194, 194, 0.12);
      text-align: center;
    }

    .header-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--rose-gold);
      margin-bottom: 6px;
      font-weight: 700;
    }

    h1 {
      color: var(--baby-pink);
      font-size: clamp(20px, 5vw, 24px);
      margin-bottom: 16px;
      font-weight: 700;
      text-shadow: 0 0 20px rgba(244, 194, 194, 0.3);
    }

    /* Paragraph Box with Unlimited Height (No Scrollbars) */
    .letter-body {
      background: rgba(8, 8, 11, 0.75);
      padding: 16px 14px;
      border-radius: 16px;
      border-left: 3px solid var(--baby-pink);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: clamp(13px, 3.8vw, 14.5px);
      line-height: 1.65;
      text-align: left;
      margin-bottom: 20px;
      max-height: none !important;
      overflow: visible !important;
    }

    #typewriter-text {
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background-color: var(--baby-pink);
      animation: blink 0.7s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .gallery-title {
      color: var(--text-muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .photo-card {
      background: rgba(22, 22, 28, 0.85);
      border-radius: 12px;
      padding: 4px;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .photo-card img {
      width: 100%;
      height: clamp(80px, 20vw, 110px);
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .btn {
      background: linear-gradient(135deg, var(--baby-pink) 0%, var(--rose-gold) 60%, var(--hot-rose) 100%);
      color: #0d0608;
      border: none;
      width: 100%;
      max-width: 250px;
      min-height: 48px;
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 800;
      border-radius: 30px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 6px 20px rgba(224, 122, 95, 0.35);
    }

    .btn:active {
      transform: scale(0.95);
    }

    #youtube-player {
      position: absolute;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* Modal Lightbox */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(5, 5, 8, 0.94);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      position: relative;
      max-width: 95%;
      max-height: 80vh;
      border-radius: 16px;
      border: 1px solid var(--border-color);
    }

    .modal-img {
      width: 100%;
      max-height: 75vh;
      border-radius: 15px;
      display: block;
      object-fit: contain;
    }

    .modal-close {
      position: absolute;
      top: -15px;
      right: -15px;
      background: var(--baby-pink);
      color: var(--bg-dark);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Touch Overlay: Unlocks Audio Immediately -->
  <div id="start-screen" onclick="openExperience()">
    <div class="start-heart">💖</div>
    <div class="start-btn">Open Letter</div>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>
  <div id="youtube-player"></div>

  <canvas id="canvas-bg"></canvas>
  <div class="ambient-glow"></div>

  <div class="audio-control" id="audioBtn" onclick="toggleAudio()">
    <span>🔊</span>
  </div>

  <div class="card-wrapper">
    <div class="card">
      <span class="header-tag">Private Letter ✨</span>
      <h1>To My Safe Space 🤍</h1>

      <div class="letter-body">
        <span id="typewriter-text"></span><span class="cursor"></span>
      </div>

      <div class="gallery-title">My Favorite Memories 🌸</div>
      <div class="photo-grid">
        <div class="photo-card" onclick="openModal('pic1.png')">
          <img src="pic1.png" alt="Memory 1">
        </div>
        <div class="photo-card" onclick="openModal('pic2.png')">
          <img src="pic2.png" alt="Memory 2">
        </div>
        <div class="photo-card" onclick="openModal('pic3.png')">
          <img src="pic3.png" alt="Memory 3">
        </div>
      </div>

      <button class="btn" onclick="triggerMegaRoseExplosion()">I Love You</button>
    </div>
  </div>

  <div class="modal" id="imageModal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-close" onclick="closeModal()">✕</div>
      <img src="" alt="Expanded Memory" class="modal-img" id="modalImg">
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const message = "ya ru7i,\n\nYour letter completely made my day. Reading your words when I was down made me smile so hard and reminded me how lucky I am to have you in my life.\n\nYou said 'I love you' doesn't feel like enough sometimes, and I feel the exact same way. You're my comfort zone, my safe space, and my favorite part of every day.\n\nThank you for always caring about me. I definitely love you more though. ❤️";

    let index = 0;
    function typeWriter() {
      if (index < message.length) {
        document.getElementById("typewriter-text").textContent += message.charAt(index);
        index++;
        setTimeout(typeWriter, 30);
      } else {
        document.querySelector('.cursor').style.display = 'none';
      }
    }

    let ytPlayer;
    let isPlaying = false;
    const bgMusic = document.getElementById('bgMusic');

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('youtube-player', {
        height: '1',
        width: '1',
        videoId: 'XKVfwahVTsQ',
        playerVars: { 'playsinline': 1, 'controls': 0, 'loop': 1, 'playlist': 'XKVfwahVTsQ' }
      });
    }

    function openExperience() {
      const overlay = document.getElementById('start-screen');
      overlay.style.opacity = '0';
      setTimeout(() => { overlay.style.display = 'none'; }, 500);

      typeWriter();

      // Audio trigger on user touch
      if (bgMusic) {
        bgMusic.play().then(() => {
          isPlaying = true;
          document.getElementById('audioBtn').querySelector('span').innerText = '🔊';
        }).catch(() => {
          if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
            ytPlayer.playVideo();
            isPlaying = true;
            document.getElementById('audioBtn').querySelector('span').innerText = '🔊';
          }
        });
      }
    }

    function toggleAudio() {
      if (isPlaying) {
        if (bgMusic) bgMusic.pause();
        if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') ytPlayer.pauseVideo();
        document.getElementById('audioBtn').querySelector('span').innerText = '🎵';
        isPlaying = false;
      } else {
        if (bgMusic) {
          bgMusic.play().catch(() => {
            if (ytPlayer && typeof ytPlayer.playVideo === 'function') ytPlayer.playVideo();
          });
        }
        document.getElementById('audioBtn').querySelector('span').innerText = '🔊';
        isPlaying = true;
      }
    }

    // Canvas Background
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = Array.from({ length: 35 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2 + 0.5,
      speedY: -(Math.random() * 0.3 + 0.1),
      opacity: Math.random() * 0.5 + 0.2,
      update() { this.y += this.speedY; if (this.y < 0) this.y = canvas.height; },
      draw() { ctx.fillStyle = `rgba(244, 194, 194, ${this.opacity})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
    }));

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    function openModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('imageModal').classList.add('active');
    }
    function closeModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    function triggerMegaRoseExplosion() {
      const emojis = ['🌹', '🌸', '💖', '✨'];
      for (let i = 0; i < 45; i++) {
        let rose = document.createElement('div');
        rose.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        rose.style.position = 'fixed';
        rose.style.left = '50%';
        rose.style.top = '50%';
        rose.style.fontSize = (Math.random() * 14 + 16) + 'px';
        rose.style.pointerEvents = 'none';
        rose.style.zIndex = '9999';
        
        let angle = Math.random() * Math.PI * 2;
        let distance = Math.random() * (Math.min(window.innerWidth, window.innerHeight) * 0.38);
        let dx = Math.cos(angle) * distance;
        let dy = Math.sin(angle) * distance;

        rose.animate([
          { transform: `translate3d(-50%, -50%, 0) scale(0.3)`, opacity: 1 },
          { transform: `translate3d(calc(-50% + ${dx}px), calc(-50% + ${dy}px), 0) scale(1.2)`, opacity: 0 }
        ], { duration: 1500, easing: 'ease-out' });

        document.body.appendChild(rose);
        setTimeout(() => rose.remove(), 1500);
      }
    }
  </script>
</body>
</html>
